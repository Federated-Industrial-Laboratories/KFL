# Packaging metadata for the k26rl package. Building a wheel or
# publishing to an index is a deliberate release step, not implied by
# this file's presence.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "k26rl"
version = "0.1.0"
description = "Gymnasium environments over compiled KFL reinforcement learning artifacts"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.1",
    "numpy>=1.21",
]

# The multi-agent shape needs pettingzoo and is imported only when it
# is asked for, so a consumer who wants the single-agent shapes never
# installs it.
#
# The floor is the version this package was verified against, 1.27.0,
# and no lower bound was tested: an older release may well work, but
# saying so here without having run it would be a claim rather than a
# fact. A consumer who needs an older one lowers the floor and runs
# the multi-agent gate.
#
# It adds one package and no other. Measured against the pinned
# gymnasium with `pip show`: pettingzoo requires gymnasium, numpy and
# typing-extensions, and gymnasium requires cloudpickle,
# farama-notifications, numpy and typing-extensions, so every
# requirement of pettingzoo is already a requirement of gymnasium and
# the closure grows by pettingzoo itself.
[project.optional-dependencies]
multiagent = [
    "pettingzoo>=1.27",
]

[tool.setuptools]
packages = ["k26rl"]
