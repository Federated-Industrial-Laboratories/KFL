# Packaging metadata for the k26rl package. Building a wheel or
# publishing to an index is a deliberate release step, not implied by
# this file's presence.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "k26rl"
version = "0.1.0"
description = "Gymnasium environments over compiled KFL reinforcement learning artifacts"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.1",
    "numpy>=1.21",
]

# The multi-agent shape needs pettingzoo and is imported only when it
# is asked for, so a consumer who wants the single-agent shapes never
# installs it.
[project.optional-dependencies]
multiagent = [
    "pettingzoo>=1.27",
]

[tool.setuptools]
packages = ["k26rl"]
